name: E2E

# The E2E suites (`npm run test:e2e`, config `vitest.e2e.config.ts`) talk to real
# backends, so they are kept out of `ci.yml` and out of the default PR gate.
#
# Trigger choices:
# - `workflow_dispatch`: both suites must always be runnable on demand.
# - `pull_request` (paths-filtered): the Floppy suite needs NO secret — it runs
#   against a throwaway container this workflow starts itself — so it is safe on
#   PRs, including from forks. The `paths` filter keeps it off doc-only PRs.
# - `schedule` (weekly): catches drift in the upstream Floppy image and gives the
#   mdblist suite its only recurring run, at a rate its free-tier quota tolerates.
#
# The mdblist suite is deliberately NOT on `pull_request`: it hits a real hosted
# account on a free tier capped at 1000 requests/day with only four static lists,
# billed ~2 quota units per HTTP call. Running it on every push would be hostile,
# so it is gated on the `E2E_MDBLIST_API_KEY` secret and skips cleanly without it
# (fork PRs never receive secrets, and must not fail because of that).
on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/Targets/**'
      - 'tests/e2e/**'
      - 'vitest.e2e.config.ts'
      - '.github/workflows/e2e.yml'
  schedule:
    # Mondays at 04:00 UTC.
    - cron: '0 4 * * 1'

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  floppy:
    name: E2E - Floppy
    runs-on: ubuntu-latest
    env:
      FLOPPY_PORT: 8000
      FLOPPY_CONTAINER: e2e-floppy
      REDIS_CONTAINER: e2e-redis
      DOCKER_NETWORK: e2e-net
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Plain `docker run` rather than `services:` or a committed compose file:
      # the bootstrap is a sequence (start -> poll health -> `docker exec` a token
      # out of the app container), and `services:` offers no hook between "started"
      # and "ready" for a container whose cold start is ~90s. Keeping the three
      # steps inline also means the whole procedure is readable in one place
      # instead of being split across a second file.
      - name: Start Redis and Floppy
        run: |
          docker network create "$DOCKER_NETWORK"
          docker run -d --name "$REDIS_CONTAINER" --network "$DOCKER_NETWORK" redis:8-alpine
          docker run -d --name "$FLOPPY_CONTAINER" --network "$DOCKER_NETWORK" \
            -p "${FLOPPY_PORT}:8000" \
            -e SECRET="$(openssl rand -hex 32)" \
            -e REDIS_URL="redis://${REDIS_CONTAINER}:6379" \
            -e DEBUG=False \
            -e ADMIN_ENABLED=False \
            -e DEMO_ACCOUNT_ENABLED=False \
            ghcr.io/dannyvfilms/floppy:latest

      # Cold start is roughly 90s (measured: ~96s from `docker run` to the first
      # 200). A fixed `sleep` would be flaky in both directions, so poll and fail
      # loudly — with the container logs — if readiness never arrives.
      - name: Wait for Floppy to be ready
        run: |
          start=$(date +%s)
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              "http://127.0.0.1:${FLOPPY_PORT}/api/v1/health" || true)
            if [ "$code" = "200" ]; then
              echo "Floppy ready after $(( $(date +%s) - start ))s"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Floppy did not answer 200 on /api/v1/health within 300s"
          docker logs "$FLOPPY_CONTAINER"
          exit 1

      # The token is printed by the Django shell; mask it before it can reach any
      # later log line, and hand it over through the environment rather than an
      # argument. stderr is dropped and `tail -n1` applied because the shell also
      # prints its auto-import banner.
      - name: Mint an API token
        run: |
          token=$(docker exec "$FLOPPY_CONTAINER" python manage.py shell \
            -c "from users.models import User; u,_ = User.objects.get_or_create(username='e2e'); print(u.token)" \
            2>/dev/null | tail -n1 | tr -d '\r')
          if [ -z "$token" ]; then
            echo "::error::Could not mint a Floppy API token"
            exit 1
          fi
          echo "::add-mask::$token"
          echo "E2E_FLOPPY_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run Floppy E2E suite
        env:
          E2E_FLOPPY_URL: http://127.0.0.1:${{ env.FLOPPY_PORT }}
        run: npm run test:e2e

      - name: Dump Floppy logs on failure
        if: failure()
        run: docker logs --tail 200 "$FLOPPY_CONTAINER"

      - name: Tear down
        if: always()
        run: |
          docker rm -f "$FLOPPY_CONTAINER" "$REDIS_CONTAINER" || true
          docker network rm "$DOCKER_NETWORK" || true

  # `secrets` is not available in a job-level `if:`, so presence is resolved here
  # and consumed as a plain output. The mdblist job then skips as a job (never
  # fails) whenever the secret is missing, which is always the case on forks.
  mdblist-guard:
    name: E2E - mdblist (secret check)
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      has_key: ${{ steps.check.outputs.has_key }}
    steps:
      - name: Check for E2E_MDBLIST_API_KEY
        id: check
        env:
          KEY: ${{ secrets.E2E_MDBLIST_API_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo 'has_key=true' >> "$GITHUB_OUTPUT"
          else
            echo 'has_key=false' >> "$GITHUB_OUTPUT"
            echo '::notice::E2E_MDBLIST_API_KEY is not set, skipping the mdblist E2E suite'
          fi

  mdblist:
    name: E2E - mdblist
    runs-on: ubuntu-latest
    needs: mdblist-guard
    if: needs.mdblist-guard.outputs.has_key == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Only `E2E_MDBLIST_API_KEY` is exported, so the Floppy suite in the same
      # run self-skips on its own missing variables — one backend per job.
      - name: Run mdblist E2E suite
        env:
          E2E_MDBLIST_API_KEY: ${{ secrets.E2E_MDBLIST_API_KEY }}
        run: npm run test:e2e
