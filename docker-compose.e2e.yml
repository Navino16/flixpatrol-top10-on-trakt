# Local infrastructure for the opt-in E2E suites (`npm run test:e2e`).
#
# Developer-only: this is NOT needed to run the application. It is kept separate
# from `docker-compose.yml`, which is user-facing, so nobody ends up starting a
# Floppy instance they have no use for.
#
# The FlixPatrol drift canary also needs FlareSolverr, which already lives in
# `docker-compose.yml`. Merge both files rather than duplicating the service —
# one command brings up everything the suites expect:
#
#     docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --wait
#
# Then mint a token for the dedicated `e2e` account and put it in `.env.e2e` as
# E2E_FLOPPY_API_KEY (see .env.e2e.example):
#
#     docker exec floppy-e2e python manage.py shell -c \
#       "from users.models import User; u,_ = User.objects.get_or_create(username='e2e'); print(u.token)" \
#       2>/dev/null | tail -n1
#
# Tear down, discarding the database with it:
#
#     docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
#
# Note the first start takes roughly 90 seconds: Floppy runs migrations and warms
# its Celery workers before answering /api/v1/health. `--wait` blocks until the
# healthcheck passes, so the suites never race the boot.
services:
  floppy-e2e:
    image: ghcr.io/dannyvfilms/floppy:latest
    container_name: floppy-e2e
    depends_on:
      redis-e2e:
        condition: service_started
    environment:
      - TZ=Europe/Paris
      - SECRET=e2e-only-not-a-real-secret
      - REDIS_URL=redis://redis-e2e:6379
      # No admin surface and no demo account on a throwaway instance.
      - ADMIN_ENABLED=False
      - DEMO_ACCOUNT_ENABLED=False
      # The debug toolbar slows every request and disables template caching.
      - DEBUG=False
    # Published on loopback only: this instance has a known SECRET and holds a
    # token the test suite prints, so it must never be reachable from the network.
    ports:
      - "127.0.0.1:8000:8000"
    # Deliberately NO volume for /floppy/db. A fresh, empty catalogue on every
    # `up` is what makes the cold-path bootstrap test meaningful: against a
    # long-lived instance it consumes one uncatalogued id per run and eventually
    # degrades to the warm path, testing nothing.
    healthcheck:
      # Two traps here, both measured against the image rather than assumed:
      # wget and not curl, because the image ships no curl; and 127.0.0.1 and
      # not localhost, because localhost resolves to ::1 in this container while
      # the server binds IPv4 only, so `localhost` yields Connection refused.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  redis-e2e:
    image: redis:8-alpine
    container_name: redis-e2e
    # Bounded memory with TTL-only eviction: Redis defaults to unlimited growth
    # plus noeviction, which on a small host ends as an OOM rather than an
    # eviction. `--save ""` drops RDB snapshots, pointless for a throwaway.
    command: redis-server --save "" --maxmemory 256mb --maxmemory-policy volatile-lru
